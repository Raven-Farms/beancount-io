mutation CancelSubscription(
  $clientId: String!
  $subscriptionId: String!
  $reason: CancellationReason
) {
  cancelSubscription(
    clientId: $clientId
    subscriptionId: $subscriptionId
    reason: $reason
  ) {
    success
    message
  }
}

mutation ResumeSubscription($clientId: String!, $subscriptionId: String!) {
  resumeSubscription(clientId: $clientId, subscriptionId: $subscriptionId) {
    success
    message
  }
}

mutation CreateSubscriptionSession($clientId: String!, $priceId: String!) {
  createSubscriptionSession(clientId: $clientId, priceId: $priceId) {
    success
    sessionId
    sessionUrl
    message
  }
}

mutation CreateStripePortalSession($clientId: String!) {
  createStripePortalSession(clientId: $clientId) {
    success
    sessionId
    sessionUrl
    message
  }
}

mutation ChangePlan(
  $clientId: String!
  $priceId: String!
  $prorationDate: Int
) {
  changePlan(
    clientId: $clientId
    priceId: $priceId
    prorationDate: $prorationDate
  ) {
    status
    kind
    refusal
    message
    clientSecret
    hostedInvoiceUrl
    subscriptionId
    newTier
    currentPeriodEnd
    effectiveAt
  }
}

mutation CancelScheduledPlanChange($clientId: String!) {
  cancelScheduledPlanChange(clientId: $clientId) {
    success
    message
  }
}
