query GetSubscriptionStatus {
  subscriptionStatus {
    subscriptions {
      __typename
      id
      status
      currentPeriodStart
      currentPeriodEnd
      clientId
      cancelAt
      canceledAt
      cancelAtPeriodEnd
      items {
        id
        price {
          id
          amount
          currency
          interval
          intervalCount
          trialPeriodDays
        }
        quantity
        product {
          id
          name
          description
          images
        }
      }
      paymentMethod {
        brand
        last4
      }
      nextPaymentAttempt
      latestInvoice {
        id
        amountPaid
        currency
        billingReason
      }
      scheduledChange {
        priceId
        effectiveAt
      }
    }
    hasActiveSubscription
  }
}

query GetAllTierQuotas {
  allTierQuotas {
    tier
    aiCfoTokensMax
    maxLedgers
    maxCollaboratorsPerLedger
    maxDirectives
  }
}

query PreviewPlanChange($clientId: String!, $priceId: String!) {
  previewPlanChange(clientId: $clientId, priceId: $priceId) {
    kind
    refusal
    effect
    currentPriceId
    targetPriceId
    currency
    amountDueToday
    creditApplied
    nextAmount
    nextChargeAt
    effectiveAt
    prorationDate
    alternativePriceId
    limitChanges {
      limit
      from
      to
    }
    paymentMethod {
      brand
      last4
    }
    replacesScheduledChange {
      priceId
      effectiveAt
    }
    withdrawsCancellation
  }
}
