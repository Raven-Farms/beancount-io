# The entry context with `generated_from`: the source entry's hash for a copy a
# plugin or the pad pass generated, else null (w21/443). Transaction detail
# reads it to tell a copy from its source (w21/508); a server older than
# 2026-10-21 rejects the field, and the screen then reads
# `GetLedgerEntryContext`, which omits it.
query GetLedgerTransactionContext($entryHash: String!, $ledgerId: String!) {
  getLedgerEntryContext(entryHash: $entryHash, ledgerId: $ledgerId) {
    slice
    sha256sum
    entry
    balances_before
    balances_after
    generated_from
  }
}
