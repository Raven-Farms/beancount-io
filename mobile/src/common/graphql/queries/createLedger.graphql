mutation CreateLedger(
  $name: String!
  $private: Boolean
  $description: String
  $template: LedgerTemplate
  $setup: LedgerSetupInput
  $requestId: String
) {
  createLedger(
    name: $name
    private: $private
    description: $description
    template: $template
    setup: $setup
    requestId: $requestId
  ) {
    id
    name
    fullName
    description
    private
    empty
    size
    createdAt
    permissions {
      admin
      pull
      push
    }
  }
}
