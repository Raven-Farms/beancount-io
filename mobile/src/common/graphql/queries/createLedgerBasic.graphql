# `createLedger` without the arguments a server added later (`setup`, `requestId`):
# the fallback for Starter and Sample on a server older than 2026-10-20, which
# rejects the full document (w21/592).
mutation CreateLedgerBasic(
  $name: String!
  $private: Boolean
  $description: String
  $template: LedgerTemplate
) {
  createLedger(
    name: $name
    private: $private
    description: $description
    template: $template
  ) {
    id
    name
    fullName
    description
    private
    empty
    size
    createdAt
    permissions {
      admin
      pull
      push
    }
  }
}
