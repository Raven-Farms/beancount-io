# `getLedgerErrors` without the fields a server added later (`code`, `hint`):
# the fallback for a server older than 2026-10-21, which rejects the full
# document with a validation error (w21/591).
query getLedgerErrorsBasic($ledgerId: String!) {
  getLedgerErrors(ledgerId: $ledgerId) {
    filename
    lineno
    message
  }
}
